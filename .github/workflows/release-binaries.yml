name: Build binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      target:
        description: "Binary platform target to build"
        required: true
        default: all
        type: choice
        options:
          - all
          - windows
          - linux
          - macos
          - macos-arm64
          - macos-x86_64

permissions:
  contents: write

jobs:
  build-docs:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # important if you later use setuptools-scm to get the version from git tags

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install docs dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r docs/requirements.txt

      - name: Build UI (uic + rcc + patch imports)
        run: |
          python scripts/build_ui.py

      - name: Install RepTate (editable) so Sphinx can read the version and other metadata
        run: |
          python -m pip install -e .

      - name: Set build date for docs
        run: |
          echo "REPTATE_BUILD_DATE=$(date -u +%Y-%m-%d)" >> $GITHUB_ENV

      - name: Build Sphinx HTML docs
        run: |
          python -m sphinx -b html docs/source docs/build/html

      - name: Upload docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: reptate-docs-html
          path: docs/build/html

  build-windows:
    if: github.event_name == 'push' || inputs.target == 'all' || inputs.target == 'windows'
    needs: build-docs
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
            fetch-depth: 0 # important if you later use setuptools-scm to get the version from git tags
            fetch-tags: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download docs artifact
        uses: actions/download-artifact@v4
        with:
          name: reptate-docs-html
          path: docs_html

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install Nuitka

      - name: Report Windows native toolchain
        shell: pwsh
        run: |
          where.exe gcc
          where.exe g++
          where.exe mingw32-make
          gcc --version
          g++ --version
          gcc -v 2>&1
          g++ -v 2>&1

      - name: Build UI (uic + rcc + patch imports)
        run: |
          python scripts/build_ui.py

      - name: Install RepTate (editable) so that Nuitka can read the version and other metadata
        run: |
          python -m pip install -e .

      - name: Build RepTate native Windows libraries from source
        run: |
          python scripts/build_native_libraries.py

      - name: Verify RepTate native Windows libraries
        run: |
          python scripts/build_native_libraries.py --check --audit-dependencies

      - name: Build with Nuitka (Windows)
        shell: cmd
        run: |
          python -m nuitka ^
            --assume-yes-for-downloads ^
            --mode=standalone ^
            --enable-plugin=pyside6 ^
            --windows-console-mode=disable ^
            --windows-icon-from-ico=RepTate\gui\Images\Reptate64.ico ^
            --output-dir=dist ^
            --noinclude-qt-translations ^
            --python-flag=-m ^
            --include-package=RepTate.tools ^
            --include-module=RepTate.gui.Reptate_rc ^
            --include-module=RepTate.gui.About_rc ^
            --include-module=RepTate.gui.Theory_rc ^
            --include-module=RepTate.gui.Tool_rc ^
            --include-module=RepTate.gui.MainWindow_rc ^
            --include-data-dir=data=data ^
            --include-data-dir=RepTate\gui\Images=RepTate\gui\Images ^
            --include-data-files=RepTate\tools\*.npy=RepTate\tools\ ^
            --include-data-files=RepTate\theories\*.npz=RepTate\theories\ ^
            RepTate

      - name: Place freshly built Windows native libraries in the package
        shell: pwsh
        run: |
          $distDir = Get-ChildItem -Path "dist" -Directory | Where-Object { $_.Name -like "*.dist" } | Select-Object -First 1
          if (-not $distDir) { throw "No *.dist directory found under dist/" }

          $sourceDir = Join-Path (Get-Location) "RepTate\theories"
          $authoritativeDir = Join-Path $distDir.FullName "RepTate\theories"
          $expectedNames = @(
            "bob2p5_lib_win32.so",
            "dtd_lib_win32.so",
            "kww_lib_win32.so",
            "landscape_win32.so",
            "react_lib_win32.so",
            "rouse_lib_win32.so",
            "rp_blend_lib_win32.so",
            "sccr_lib_win32.so",
            "schwarzl_lib_win32.so"
          )

          $packagedBeforeCopy = @(Get-ChildItem -LiteralPath $distDir.FullName -Recurse -File -Filter "*_win32*.so")
          $outsideAuthoritative = @($packagedBeforeCopy | Where-Object { $_.FullName -notlike "$authoritativeDir\*" })
          if ($outsideAuthoritative.Count -gt 0) {
            throw ("Redundant Windows native-library copies found outside {0}: {1}" -f $authoritativeDir, ($outsideAuthoritative.FullName -join ', '))
          }
          if ($packagedBeforeCopy.Count -gt 0) {
            throw ("Nuitka already produced Windows native-library files in the authoritative directory: {0}" -f ($packagedBeforeCopy.FullName -join ', '))
          }

          New-Item -ItemType Directory -Path $authoritativeDir -Force | Out-Null
          foreach ($name in $expectedNames) {
            $source = Join-Path $sourceDir $name
            $destination = Join-Path $authoritativeDir $name
            if (-not (Test-Path -LiteralPath $source -PathType Leaf)) {
              throw "Freshly built Windows native library is missing: $source"
            }
            if (Test-Path -LiteralPath $destination) {
              throw "Refusing to overwrite an existing packaged Windows native library: $destination"
            }
            Copy-Item -LiteralPath $source -Destination $destination
          }

      - name: Audit packaged Windows native-library dependencies
        shell: pwsh
        run: |
          $distDir = Get-ChildItem -Path "dist" -Directory | Where-Object { $_.Name -like "*.dist" } | Select-Object -First 1
          if (-not $distDir) { throw "No *.dist directory found under dist/" }
          $expectedNames = @(
            "bob2p5_lib_win32.so",
            "dtd_lib_win32.so",
            "kww_lib_win32.so",
            "landscape_win32.so",
            "react_lib_win32.so",
            "rouse_lib_win32.so",
            "rp_blend_lib_win32.so",
            "sccr_lib_win32.so",
            "schwarzl_lib_win32.so"
          )
          $allNative = @(Get-ChildItem -LiteralPath $distDir.FullName -Recurse -File -Filter "*_win32*.so")
          Write-Host "Discovered packaged Windows native libraries:"
          $allNative | Group-Object Name | Sort-Object Name | ForEach-Object {
            Write-Host ("{0}:" -f $_.Name)
            $_.Group | ForEach-Object { Write-Host ("  {0}" -f ($_.FullName.Substring($distDir.FullName.Length + 1))) }
          }

          $authoritativeDir = Join-Path $distDir.FullName "RepTate\theories"
          if (-not (Test-Path -LiteralPath $authoritativeDir -PathType Container)) {
            throw "Authoritative packaged theory directory is missing: $authoritativeDir"
          }
          $native = @()
          foreach ($name in $expectedNames) {
            $matches = @(Get-ChildItem -LiteralPath $authoritativeDir -File -Filter $name)
            if ($matches.Count -ne 1) {
              throw "Expected exactly one $name in authoritative directory $authoritativeDir, found $($matches.Count)"
            }
            $native += $matches[0]
          }
          $unexpected = @($allNative | Where-Object { $_.FullName -notlike "$authoritativeDir\*" })
          if ($unexpected.Count -gt 0) {
            throw ("Redundant Windows native-library copies found outside {0}: {1}" -f $authoritativeDir, ($unexpected.FullName -join ', '))
          }
          Write-Host "Authoritative packaged RepTate native-library directory: $authoritativeDir"
          $systemDll = '^(api-ms-win-|ext-ms-win-|KERNEL32\.dll$|KERNELBASE\.dll$|NTDLL\.dll$|USER32\.dll$|ADVAPI32\.dll$|SHELL32\.dll$|OLE32\.dll$|OLEAUT32\.dll$|WS2_32\.dll$|GDI32\.dll$|COMDLG32\.dll$|RPCRT4\.dll$|MSVCRT\.dll$|UCRTBASE\.dll$|VCRUNTIME[^ ]*\.dll$|CRYPT32\.dll$|BCRYPT\.dll$|COMBASE\.dll$|SHLWAPI\.dll$|VERSION\.dll$|WINMM\.dll$|PSAPI\.dll$|IMM32\.dll$|SETUPAPI\.dll$|SECHOST\.dll$|USERENV\.dll$|NORMALIZ\.dll$)'
          foreach ($library in $native) {
            $dump = & objdump -p $library.FullName 2>&1
            if ($LASTEXITCODE -ne 0) { throw "objdump failed for $($library.FullName)" }
            $imports = @($dump | ForEach-Object { if ($_ -match 'DLL Name:\s*(.+)$') { $Matches[1].Trim() } })
            Write-Host "$($library.Name) imports: $($imports -join ', ')"
            foreach ($dependency in $imports) {
              if ($dependency -match $systemDll) { continue }
              $present = Get-ChildItem -LiteralPath $distDir.FullName -Recurse -File -Filter $dependency | Select-Object -First 1
              if (-not $present) { throw "Missing packaged non-system dependency $dependency required by $($library.FullName)" }
            }
          }
          Write-Host "Packaged Windows native-library dependency audit passed"

      - name: Add docs into dist folder (Windows)
        shell: pwsh
        run: |
          $distDir = Get-ChildItem -Path "dist" -Directory | Where-Object { $_.Name -like "*.dist" } | Select-Object -First 1
          if (-not $distDir) { throw "No *.dist directory found under dist/" }

          $target = Join-Path $distDir.FullName "docs\build\html"
          if (Test-Path (Join-Path $distDir.FullName "docs")) { Remove-Item (Join-Path $distDir.FullName "docs") -Recurse -Force }
          New-Item -ItemType Directory -Path $target | Out-Null
          Copy-Item -Path "docs_html\*" -Destination $target -Recurse -Force

      - name: Zip artifact (Windows)
        shell: pwsh
        run: |
          $zip = "RepTate-${{ github.ref_name }}-windows.zip"
          $distDir = Get-ChildItem -Path "dist" -Directory | Where-Object { $_.Name -like "*.dist" } | Select-Object -First 1
          if (-not $distDir) { throw "No *.dist directory found under dist/" }
          if (Test-Path "dist\$zip") { Remove-Item "dist\$zip" -Force }
          Compress-Archive -Path $distDir.FullName -DestinationPath "dist\$zip"
          "ZIP=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - uses: actions/upload-artifact@v4
        with:
          name: RepTate-${{ github.ref_name }}-windows
          path: dist/${{ env.ZIP }}

  build-linux:
    if: github.event_name == 'push' || inputs.target == 'all' || inputs.target == 'linux'
    needs: build-docs
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # important if you later use setuptools-scm to get the version from git tags
          fetch-tags: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Qt xcb runtime dependencies for CI
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libxcb-cursor0 \
            libxkbcommon-x11-0 \
            libxcb-icccm4 \
            libxcb-keysyms1 \
            libxcb-shape0 \
            libxcb-xkb1 \
            libegl1
          declare -A LIB_PACKAGES=(
            [libxcb-cursor.so.0]=libxcb-cursor0
            [libxkbcommon-x11.so.0]=libxkbcommon-x11-0
            [libxcb-icccm.so.4]=libxcb-icccm4
            [libxcb-keysyms.so.1]=libxcb-keysyms1
            [libxcb-shape.so.0]=libxcb-shape0
            [libxcb-xkb.so.1]=libxcb-xkb1
            [libEGL.so.1]=libegl1
          )
          for library in "${!LIB_PACKAGES[@]}"; do
            package="${LIB_PACKAGES[$library]}"
            echo "Ubuntu package providing $library: $package"
            dpkg -L "$package" | while IFS= read -r path; do
              if [[ "$(basename "$path")" == "$library" ]]; then echo "  package path: $path"; fi
            done
            ldconfig -p | awk -v library="$library" '$1 == library {print "  loader path: " $NF; exit}'
          done

      - name: Download docs artifact
        uses: actions/download-artifact@v4
        with:
          name: reptate-docs-html
          path: docs_html

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install Nuitka

      - name: Build UI (uic + rcc + patch imports)
        run: |
          python scripts/build_ui.py

      - name: Install RepTate (editable) so that Nuitka can read the version and other metadata
        run: |
          python -m pip install -e .

      - name: Build RepTate native Linux libraries from source
        run: |
          python scripts/build_native_libraries.py

      - name: Verify RepTate native Linux libraries
        run: |
          python scripts/build_native_libraries.py --check

      - name: Build with Nuitka (Linux)
        shell: bash
        run: |
          python -m nuitka \
            --mode=standalone \
            --enable-plugin=pyside6 \
            --linux-icon=RepTate/gui/Images/RepTate_logo_new.png \
            --output-dir=dist \
            --noinclude-qt-translations \
            --python-flag=-m \
            --include-package=RepTate.tools \
            --include-module=RepTate.gui.Reptate_rc \
            --include-module=RepTate.gui.About_rc \
            --include-module=RepTate.gui.Theory_rc \
            --include-module=RepTate.gui.Tool_rc \
            --include-module=RepTate.gui.MainWindow_rc \
            --include-data-dir=data=data \
            --include-data-dir=RepTate/gui/Images=RepTate/gui/Images \
            --include-data-files=RepTate/tools/*.npy=RepTate/tools/ \
            --include-data-files=RepTate/theories/*.npz=RepTate/theories/ \
            --include-data-files=RepTate/theories/*_linux*.so=RepTate/theories/ \
            RepTate

      - name: Package Qt xcb helper runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          OUTDIR="$(find dist -maxdepth 2 -type d -name '*.dist' -print -quit)"
          test -n "$OUTDIR"
          OUTDIR="$(cd "$OUTDIR" && pwd)"

          QXCB="$(find "$OUTDIR/PySide6/qt-plugins/platforms" -type f -name 'libqxcb.so' -print -quit)"
          test -n "$QXCB"
          QT_CORE="$(find "$OUTDIR" -type f \( -name 'libQt6Core.so*' -o -name 'libQt5Core.so*' \) -print -quit)"
          test -n "$QT_CORE"
          NUITKA_LIB_DIR="$(dirname "$QT_CORE")"

          declare -A HELPER_PACKAGES=(
            [libxcb-cursor.so.0]=libxcb-cursor0
            [libxkbcommon-x11.so.0]=libxkbcommon-x11-0
            [libxcb-icccm.so.4]=libxcb-icccm4
            [libxcb-keysyms.so.1]=libxcb-keysyms1
            [libxcb-shape.so.0]=libxcb-shape0
            [libxcb-xkb.so.1]=libxcb-xkb1
          )
          HELPER_LIBRARIES=(libxcb-cursor.so.0 libxkbcommon-x11.so.0 libxcb-icccm.so.4 libxcb-keysyms.so.1 libxcb-shape.so.0 libxcb-xkb.so.1)
          printf 'Nuitka shared-library directory: %s\n' "$NUITKA_LIB_DIR"

          for library in "${HELPER_LIBRARIES[@]}"; do
            package="${HELPER_PACKAGES[$library]}"
            source_link=""
            while IFS= read -r candidate; do
              if [[ "$(basename "$candidate")" == "$library" ]]; then source_link="$candidate"; break; fi
            done < <(dpkg -L "$package")
            test -n "$source_link"
            source_real="$(readlink -f "$source_link")"
            loader_path="$(ldconfig -p | awk -v library="$library" '$1 == library {print $NF; exit}')"
            test -f "$source_real"
            test -f "$loader_path"
            printf '%s loader path: %s\n' "$library" "$loader_path"
            printf '%s package path: %s\n' "$library" "$source_link"
            printf '%s real target: %s\n' "$library" "$source_real"

            test ! -e "$NUITKA_LIB_DIR/$(basename "$source_real")"
            test ! -L "$NUITKA_LIB_DIR/$(basename "$source_real")"
            test ! -e "$NUITKA_LIB_DIR/$library"
            test ! -L "$NUITKA_LIB_DIR/$library"
            cp -a "$source_real" "$NUITKA_LIB_DIR/"
            if [[ "$source_link" != "$source_real" ]]; then
              ln -s "$(basename "$source_real")" "$NUITKA_LIB_DIR/$library"
            fi
            test -e "$NUITKA_LIB_DIR/$library"
          done

      - name: Audit packaged Linux Qt xcb helper dependencies
        shell: bash
        run: |
          set -euo pipefail
          OUTDIR="$(find dist -maxdepth 2 -type d -name '*.dist' -print -quit)"
          test -n "$OUTDIR"
          OUTDIR="$(cd "$OUTDIR" && pwd)"
          QXCB="$(find "$OUTDIR/PySide6/qt-plugins/platforms" -type f -name 'libqxcb.so' -print -quit)"
          test -n "$QXCB"
          echo "Packaged libqxcb.so: $QXCB"
          LDD_OUTPUT="$(ldd "$QXCB")"
          printf '%s\n' "$LDD_OUTPUT"
          HELPER_LIBRARIES=(libxcb-cursor.so.0 libxkbcommon-x11.so.0 libxcb-icccm.so.4 libxcb-keysyms.so.1 libxcb-shape.so.0 libxcb-xkb.so.1)
          for library in "${HELPER_LIBRARIES[@]}"; do
            resolved="$(awk -v library="$library" '$1 == library && $2 == "=>" {print $3; exit}' <<<"$LDD_OUTPUT")"
            if [[ -z "$resolved" || "$resolved" == "not" ]]; then
              echo "Bundled helper is unresolved in libqxcb.so: $library" >&2
              exit 1
            fi
            case "$resolved" in
              "$OUTDIR"/*) ;;
              *) echo "Bundled helper resolves outside RepTate.dist: $library -> $resolved" >&2; exit 1 ;;
            esac
            echo "$library => $resolved (inside RepTate.dist)"
          done
          if grep -q 'not found' <<<"$LDD_OUTPUT"; then
            echo "Unresolved non-bundled dependency detected for packaged libqxcb.so" >&2
            exit 1
          fi

          echo "Bundled helper dependency audits:"
          for library in "${HELPER_LIBRARIES[@]}"; do
            helper_path="$(find -L "$OUTDIR" -name "$library" -print -quit)"
            test -f "$helper_path"
            helper_ldd="$(ldd "$helper_path")"
            printf '%s:\n%s\n' "$library" "$helper_ldd"
            if grep -q 'not found' <<<"$helper_ldd"; then
              echo "Unresolved dependency detected in bundled helper $library" >&2
              exit 1
            fi
          done
          echo "Packaged Linux Qt xcb helper dependency audit passed"

      - name: Smoke-test packaged RepTate (offscreen)
        shell: bash
        run: |
          set -euo pipefail
          OUTDIR="$(find dist -maxdepth 2 -type d -name '*.dist' -print -quit)"
          test -n "$OUTDIR"
          EXECUTABLE="$OUTDIR/RepTate.bin"
          test -f "$EXECUTABLE"
          test -x "$EXECUTABLE"
          ls -l "$EXECUTABLE"
          file "$EXECUTABLE"
          QT_QPA_PLATFORM=offscreen timeout 60s "$EXECUTABLE" --version
          echo "Packaged RepTate offscreen smoke test passed"

      - name: Add docs into dist folder (Linux)
        shell: bash
        run: |
          OUTDIR="$(find dist -maxdepth 2 -type d -name '*.dist' | head -n 1)"
          test -n "$OUTDIR"
          rm -rf "$OUTDIR/docs"
          mkdir -p "$OUTDIR/docs/build/html"
          cp -a docs_html/. "$OUTDIR/docs/build/html/"

      - name: Zip artifact (Linux)
        shell: bash
        run: |
          ZIP="RepTate-${{ github.ref_name }}-linux.zip"
          OUTDIR="$(find dist -maxdepth 2 -type d -name '*.dist' | head -n 1)"
          test -n "$OUTDIR"
          rm -f "dist/$ZIP"
          (cd "$(dirname "$OUTDIR")" && zip -r "$GITHUB_WORKSPACE/dist/$ZIP" "$(basename "$OUTDIR")")
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: RepTate-${{ github.ref_name }}-linux
          path: dist/${{ env.ZIP }}

  # Legacy macOS 11 / Big Sur Intel compatibility experiment.
  # Disabled by default; reference only. It requires Big-Sur-compatible native
  # wheels, notably a SciPy build other than the macOS-14 Accelerate wheel.
  # legacy-macos-intel-big-sur:
  #   runs-on: macos-15-intel
  #   # Retain the proven bundle settings if this experiment is restored:
  #   # --mode=app
  #   # --output-filename=RepTate.bin
  #   # --macos-app-macos-min-version=11.0
  #   # --include-package=RepTate.tools
  #   # --include-data-dir=data=data
  #   # --include-data-dir=RepTate/gui/Images=RepTate/gui/Images
  #   # --include-data-files=RepTate/tools/*.npy=RepTate/tools/
  #   # --include-data-files=RepTate/theories/*.npz=RepTate/theories/
  #   # --include-data-files=RepTate/theories/*_darwin*.so=RepTate/theories/

  build-macos:
    if: github.event_name == 'push' || inputs.target == 'all' || inputs.target == 'macos' || inputs.target == 'macos-arm64' || inputs.target == 'macos-x86_64'
    needs: build-docs
    strategy:
      fail-fast: false
      matrix: >-
        ${{ fromJSON(
          (github.event_name == 'push' || inputs.target == 'all' || inputs.target == 'macos') && '[{"architecture":"arm64","runner":"macos-15"},{"architecture":"x86_64","runner":"macos-15-intel"}]' ||
          inputs.target == 'macos-arm64' && '[{"architecture":"arm64","runner":"macos-15"}]' ||
          '[{"architecture":"x86_64","runner":"macos-15-intel"}]'
        ) }}
    runs-on: ${{ matrix.runner }}
    env:
      # SciPy 1.15.3's Intel macOS wheel uses Accelerate and can require 14.0.
      MACOS_MIN_VERSION: "14.0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # important if you later use setuptools-scm to get the version from git tags
          fetch-tags: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download docs artifact
        uses: actions/download-artifact@v4
        with:
          name: reptate-docs-html
          path: docs_html

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install Nuitka

      - name: Build UI (uic + rcc + patch imports)
        run: |
          python scripts/build_ui.py

      - name: Install RepTate (editable) so that Nuitka can read the version and other metadata
        run: |
          python -m pip install -e .

      - name: Build RepTate native macOS libraries (${{ matrix.architecture }})
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ env.MACOS_MIN_VERSION }}
        run: |
          python scripts/build_native_libraries.py

      - name: Audit RepTate native libraries before Nuitka
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_ARCH="${{ matrix.architecture }}"
          shopt -s nullglob
          libraries=(RepTate/theories/*_darwin*.so)
          test "${#libraries[@]}" -gt 0
          echo "== RepTate Darwin native libraries (${EXPECTED_ARCH}) =="
          for library in "${libraries[@]}"; do
            echo "path: $library"
            file_info="$(file "$library")"
            echo "$file_info"
            actual_arch="$(lipo -archs "$library")"
            echo "architectures: $actual_arch"
            if [[ "$actual_arch" != "$EXPECTED_ARCH" ]]; then
              echo "::error file=$library::architecture $actual_arch does not match expected $EXPECTED_ARCH"
              exit 1
            fi
          done

      - name: Smoke-test Python and RepTate imports
        shell: bash
        run: |
          python - <<'PY'
          import PySide6
          import numpy
          import scipy
          import scipy.interpolate
          import scipy.linalg
          import scipy.optimize
          import RepTate
          import RepTate.gui.Reptate_rc
          import RepTate.tools.polymer_data
          print("dependency and RepTate imports: passed")
          PY
          QT_QPA_PLATFORM=offscreen python -c "from PySide6.QtWidgets import QApplication; app = QApplication([]); import RepTate; print('offscreen Qt smoke test: passed')"

      - name: Build with Nuitka (macOS ${{ matrix.architecture }})
        shell: bash
        run: |
          python -m nuitka \
            --mode=app \
            --enable-plugin=pyside6 \
            --macos-app-icon=RepTate/gui/Images/RepTate_logo_new.icns \
            --macos-app-macos-min-version=${{ env.MACOS_MIN_VERSION }} \
            --output-dir=dist \
            --output-filename=RepTate.bin \
            --noinclude-qt-translations \
            --python-flag=-m \
            --include-package=RepTate.tools \
            --include-module=RepTate.gui.Reptate_rc \
            --include-module=RepTate.gui.About_rc \
            --include-module=RepTate.gui.Theory_rc \
            --include-module=RepTate.gui.Tool_rc \
            --include-module=RepTate.gui.MainWindow_rc \
            --include-data-dir=data=data \
            --include-data-dir=RepTate/gui/Images=RepTate/gui/Images \
            --include-data-files=RepTate/tools/*.npy=RepTate/tools/ \
            --include-data-files=RepTate/theories/*.npz=RepTate/theories/ \
            --include-data-files=RepTate/theories/*_darwin*.so=RepTate/theories/ \
            RepTate

      - name: Add docs into app/dist folder (macOS)
        shell: bash
        run: |
          APP_PATH="dist/RepTate.app"
          RESOURCES_DIR="$APP_PATH/Contents/Resources"
          test -d "$APP_PATH"
          mkdir -p "$RESOURCES_DIR/docs/build/html"
          cp -a docs_html/. "$RESOURCES_DIR/docs/build/html/"

      - name: Audit macOS bundle compatibility
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="dist/RepTate.app"
          EXECUTABLE="$APP_PATH/Contents/MacOS/RepTate.bin"
          EXPECTED_ARCH="${{ matrix.architecture }}"
          CLAIMED_MIN_MACOS="${{ env.MACOS_MIN_VERSION }}"

          require_file() {
            local label="$1"
            local path="$2"
            if [[ -f "$path" ]]; then
              echo "present file ($label): $path"
            else
              echo "::error::Missing required file ($label): $path"
              return 1
            fi
          }

          require_file "main RepTate executable" "$EXECUTABLE"

          echo "== macOS build identity =="
          RUNNER_ARCH="$(uname -m)"
          PYTHON_ARCH="$(python -c 'import platform; print(platform.machine())')"
          echo "runner architecture: $RUNNER_ARCH"
          echo "Python architecture: $PYTHON_ARCH"
          echo "expected architecture: $EXPECTED_ARCH"
          if [[ "$RUNNER_ARCH" != "$EXPECTED_ARCH" ]]; then
            echo "::error::Runner architecture $RUNNER_ARCH does not match expected $EXPECTED_ARCH"
            exit 1
          fi
          if [[ "$PYTHON_ARCH" != "$EXPECTED_ARCH" ]]; then
            echo "::error::Python architecture $PYTHON_ARCH does not match expected $EXPECTED_ARCH"
            exit 1
          fi

          version_is_newer() {
            local required="$1"
            local claimed="$2"
            local required_major="${required%%.*}"
            local required_minor="${required#*.}"
            local claimed_major="${claimed%%.*}"
            local claimed_minor="${claimed#*.}"
            required_minor="${required_minor%%.*}"
            claimed_minor="${claimed_minor%%.*}"
            (( required_major > claimed_major || (required_major == claimed_major && required_minor > claimed_minor) ))
          }

          audit_binary() {
            local binary="$1"
            local file_info
            local architecture
            local deployment_target
            file_info="$(file "$binary")"
            architecture="unknown"
            case "$file_info" in
              *x86_64*) architecture="x86_64" ;;
              *arm64*) architecture="arm64" ;;
            esac
            echo "path: $binary"
            echo "architecture: $architecture"
            echo "$file_info"
            if [[ "$architecture" != "$EXPECTED_ARCH" ]]; then
              echo "::error file=$binary::architecture $architecture does not match expected $EXPECTED_ARCH"
              return 1
            fi
            deployment_target="$(otool -l "$binary" | awk '
              /LC_BUILD_VERSION/ { build=1; legacy=0; next }
              /LC_VERSION_MIN_MACOSX/ { legacy=1; build=0; next }
              build && $1 == "minos" { print $2; exit }
              legacy && $1 == "version" { print $2; exit }
            ')"
            echo "minimum macOS deployment target: ${deployment_target:-unknown}"
            if [[ -z "$deployment_target" ]]; then
              echo "::warning file=$binary::could not determine minimum macOS deployment target"
            elif version_is_newer "$deployment_target" "$CLAIMED_MIN_MACOS"; then
              echo "::error file=$binary::requires macOS $deployment_target, newer than claimed minimum $CLAIMED_MIN_MACOS"
              return 1
            fi
            otool -l "$binary" | grep -A4 -E 'LC_BUILD_VERSION|LC_VERSION_MIN_MACOSX' | grep -E 'cmd |platform |minos |version ' || true
          }

          echo "== main executable =="
          audit_binary "$EXECUTABLE"

          find_representative() {
            local label="$1"
            local pattern="$2"
            local binary
            binary="$(find "$APP_PATH/Contents" -type f \( -name '*.dylib' -o -name '*.so' \) -print | grep -Ei "$pattern" | sort | head -n 1 || true)"
            if [[ -n "$binary" ]]; then
              echo "== $label representative =="
              audit_binary "$binary"
            else
              echo "::warning::No representative $label native binary found (pattern: $pattern)"
            fi
          }

          echo "== representative native components =="
          find_representative "PySide6 / Qt" 'pyside6|/qt[^/]*|qt[^/]*\.(dylib|so)$'
          find_representative "Shiboken" 'shiboken'
          find_representative "NumPy" 'numpy'
          find_representative "SciPy" 'scipy'
          find_representative "RepTate native" '_darwin[^/]*\.so$'

          echo "== all RepTate Darwin native libraries =="
          reptate_native_count=0
          while IFS= read -r binary; do
            [[ -n "$binary" ]] || continue
            reptate_native_count=$((reptate_native_count + 1))
            audit_binary "$binary"
          done < <(find "$APP_PATH/Contents" -type f -name '*_darwin*.so' -print | sort)
          if (( reptate_native_count == 0 )); then
            echo "::error::No packaged RepTate Darwin native libraries found"
            exit 1
          fi

          require_directory() {
            local label="$1"
            local path="$2"
            if [[ -d "$path" ]]; then
              echo "present directory ($label): $path"
            else
              echo "::error::Missing required directory ($label): $path"
              return 1
            fi
          }

          echo "== bundle layout (relevant paths) =="
          find "$APP_PATH/Contents" -maxdepth 7 \( -type d -o -type l \) -print | grep -E '/(data|RepTate|theories|tools|Images|docs|html)(/|$)' | sort || true

          echo "== bundle resources =="
          DATA_DIR=""
          for candidate in \
            "$APP_PATH/Contents/Resources/data" \
            "$APP_PATH/Contents/MacOS/data"; do
            if [[ -d "$candidate" ]]; then
              echo "present runtime data directory: $candidate"
              DATA_DIR="$candidate"
              break
            fi
            echo "missing runtime data candidate: $candidate"
          done
          if [[ -z "$DATA_DIR" ]]; then
            echo "::error::Missing runtime data directory; checked Contents/Resources/data and Contents/MacOS/data"
            exit 1
          fi

          require_directory "offline HTML documentation" "$APP_PATH/Contents/Resources/docs/build/html"

          PACKAGE_DIR=""
          for candidate in \
            "$APP_PATH/Contents/MacOS/RepTate" \
            "$APP_PATH/Contents/Resources/RepTate"; do
            if [[ -d "$candidate" ]]; then
              echo "present RepTate package directory: $candidate"
              PACKAGE_DIR="$candidate"
              break
            fi
            echo "missing RepTate package candidate: $candidate"
          done
          if [[ -z "$PACKAGE_DIR" ]]; then
            echo "::error::Missing RepTate package directory; checked Contents/MacOS/RepTate and Contents/Resources/RepTate"
            exit 1
          fi

          require_directory "RepTate theories" "$PACKAGE_DIR/theories"
          require_directory "RepTate tools" "$PACKAGE_DIR/tools"
          require_directory "RepTate GUI images" "$PACKAGE_DIR/gui/Images"
          echo "Runtime data, RepTate package resources, and offline HTML docs are present"

      - name: Ad-hoc sign and package macOS app (${{ matrix.architecture }})
        shell: bash
        run: |
          python scripts/sign_macos_app.py \
            "dist/RepTate.app" \
            "dist/RepTate-${{ github.ref_name }}-macos-${{ matrix.architecture }}.dmg"

      - name: Zip artifact (macOS ${{ matrix.architecture }})
        shell: bash
        run: |
          ZIP="RepTate-${{ github.ref_name }}-macos-${{ matrix.architecture }}.zip"
          OUTDIR="dist/RepTate.app"
          test -d "$OUTDIR"
          rm -f "dist/$ZIP"
          (cd "$(dirname "$OUTDIR")" && zip -r "$GITHUB_WORKSPACE/dist/$ZIP" "$(basename "$OUTDIR")")
          unzip -l "dist/$ZIP" | grep -q 'RepTate.app/Contents/MacOS/RepTate.bin'
          unzip -l "dist/$ZIP" | grep -q 'RepTate.app/Contents/Resources/docs/build/html/'
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Set DMG artifact name (macOS ${{ matrix.architecture }})
        shell: bash
        run: echo "DMG=RepTate-${{ github.ref_name }}-macos-${{ matrix.architecture }}.dmg" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: RepTate-${{ github.ref_name }}-macos-${{ matrix.architecture }}
          path: |
            dist/${{ env.ZIP }}
            dist/${{ env.DMG }}

  release:
    if: always() && startsWith(github.ref, 'refs/tags/v') && needs.build-docs.result == 'success' && needs.build-windows.result == 'success' && needs.build-linux.result == 'success' && needs.build-macos.result == 'success'
    needs: [build-docs, build-windows, build-linux, build-macos]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            **/*.zip
            **/*.dmg
