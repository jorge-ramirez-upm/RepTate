name: Build binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-docs:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # important if you later use setuptools-scm to get the version from git tags

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install docs dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r docs/requirements.txt

      - name: Build UI (uic + rcc + patch imports)
        run: |
          python scripts/build_ui.py

      - name: Install RepTate (editable) so Sphinx can read the version and other metadata
        run: |
          python -m pip install -e .

      - name: Set build date for docs
        run: |
          echo "REPTATE_BUILD_DATE=$(date -u +%Y-%m-%d)" >> $GITHUB_ENV

      - name: Build Sphinx HTML docs
        run: |
          python -m sphinx -b html docs/source docs/build/html

      - name: Upload docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: reptate-docs-html
          path: docs/build/html

  build-windows:
    needs: build-docs
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
            fetch-depth: 0 # important if you later use setuptools-scm to get the version from git tags
            fetch-tags: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download docs artifact
        uses: actions/download-artifact@v4
        with:
          name: reptate-docs-html
          path: docs_html

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install Nuitka

      - name: Build UI (uic + rcc + patch imports)
        run: |
          python scripts/build_ui.py

      - name: Install RepTate (editable) so that Nuitka can read the version and other metadata
        run: |
          python -m pip install -e .

      - name: Build with Nuitka (Windows)
        shell: cmd
        run: |
          python -m nuitka ^
            --assume-yes-for-downloads ^
            --mode=standalone ^
            --enable-plugin=pyside6 ^
            --windows-console-mode=disable ^
            --windows-icon-from-ico=RepTate\gui\Images\Reptate64.ico ^
            --output-dir=dist ^
            --noinclude-qt-translations ^
            --python-flag=-m ^
            --include-package=RepTate.tools ^
            --include-module=RepTate.gui.Reptate_rc ^
            --include-module=RepTate.gui.About_rc ^
            --include-module=RepTate.gui.Theory_rc ^
            --include-module=RepTate.gui.Tool_rc ^
            --include-module=RepTate.gui.MainWindow_rc ^
            --include-data-dir=data=data ^
            --include-data-dir=RepTate\gui\Images=RepTate\gui\Images ^
            --include-data-files=RepTate\tools\*.npy=RepTate\tools\ ^
            --include-data-files=RepTate\theories\*.npz=RepTate\theories\ ^
            --include-data-files=RepTate\theories\*_win32*.so=RepTate\theories\ ^
            RepTate

      - name: Add docs into dist folder (Windows)
        shell: pwsh
        run: |
          $distDir = Get-ChildItem -Path "dist" -Directory | Where-Object { $_.Name -like "*.dist" } | Select-Object -First 1
          if (-not $distDir) { throw "No *.dist directory found under dist/" }

          $target = Join-Path $distDir.FullName "docs\build\html"
          if (Test-Path (Join-Path $distDir.FullName "docs")) { Remove-Item (Join-Path $distDir.FullName "docs") -Recurse -Force }
          New-Item -ItemType Directory -Path $target | Out-Null
          Copy-Item -Path "docs_html\*" -Destination $target -Recurse -Force

      - name: Zip artifact (Windows)
        shell: pwsh
        run: |
          $zip = "RepTate-${{ github.ref_name }}-windows.zip"
          $distDir = Get-ChildItem -Path "dist" -Directory | Where-Object { $_.Name -like "*.dist" } | Select-Object -First 1
          if (-not $distDir) { throw "No *.dist directory found under dist/" }
          if (Test-Path "dist\$zip") { Remove-Item "dist\$zip" -Force }
          Compress-Archive -Path $distDir.FullName -DestinationPath "dist\$zip"
          "ZIP=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - uses: actions/upload-artifact@v4
        with:
          name: RepTate-${{ github.ref_name }}-windows
          path: dist/${{ env.ZIP }}

  build-linux:
    needs: build-docs
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # important if you later use setuptools-scm to get the version from git tags
          fetch-tags: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download docs artifact
        uses: actions/download-artifact@v4
        with:
          name: reptate-docs-html
          path: docs_html

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install Nuitka

      - name: Build UI (uic + rcc + patch imports)
        run: |
          python scripts/build_ui.py

      - name: Install RepTate (editable) so that Nuitka can read the version and other metadata
        run: |
          python -m pip install -e .

      - name: Build with Nuitka (Linux)
        shell: bash
        run: |
          python -m nuitka \
            --mode=standalone \
            --enable-plugin=pyside6 \
            --linux-icon=RepTate/gui/Images/RepTate_logo_new.png \
            --output-dir=dist \
            --noinclude-qt-translations \
            --python-flag=-m \
            --include-package=RepTate.tools \
            --include-module=RepTate.gui.Reptate_rc \
            --include-module=RepTate.gui.About_rc \
            --include-module=RepTate.gui.Theory_rc \
            --include-module=RepTate.gui.Tool_rc \
            --include-module=RepTate.gui.MainWindow_rc \
            --include-data-dir=data=data \
            --include-data-dir=RepTate/gui/Images=RepTate/gui/Images \
            --include-data-files=RepTate/tools/*.npy=RepTate/tools/ \
            --include-data-files=RepTate/theories/*.npz=RepTate/theories/ \
            --include-data-files=RepTate/theories/*_linux*.so=RepTate/theories/ \
            RepTate

      - name: Add docs into dist folder (Linux)
        shell: bash
        run: |
          OUTDIR="$(find dist -maxdepth 2 -type d -name '*.dist' | head -n 1)"
          test -n "$OUTDIR"
          rm -rf "$OUTDIR/docs"
          mkdir -p "$OUTDIR/docs/build/html"
          cp -a docs_html/. "$OUTDIR/docs/build/html/"

      - name: Zip artifact (Linux)
        shell: bash
        run: |
          ZIP="RepTate-${{ github.ref_name }}-linux.zip"
          OUTDIR="$(find dist -maxdepth 2 -type d -name '*.dist' | head -n 1)"
          test -n "$OUTDIR"
          rm -f "dist/$ZIP"
          (cd "$(dirname "$OUTDIR")" && zip -r "$GITHUB_WORKSPACE/dist/$ZIP" "$(basename "$OUTDIR")")
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: RepTate-${{ github.ref_name }}-linux
          path: dist/${{ env.ZIP }}

  build-macos:
    needs: build-docs
    # The supported manual-test machine is Intel macOS Big Sur.  Keep this
    # explicit: the default macOS label may select an Apple Silicon runner.
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # important if you later use setuptools-scm to get the version from git tags
          fetch-tags: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download docs artifact
        uses: actions/download-artifact@v4
        with:
          name: reptate-docs-html
          path: docs_html

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install Nuitka

      - name: Build UI (uic + rcc + patch imports)
        run: |
          python scripts/build_ui.py

      - name: Install RepTate (editable) so that Nuitka can read the version and other metadata
        run: |
          python -m pip install -e .

      - name: Build with Nuitka (macOS)
        shell: bash
        run: |
          python -m nuitka \
            --mode=app \
            --enable-plugin=pyside6 \
            --macos-app-icon=RepTate/gui/Images/RepTate_logo_new.icns \
            --macos-app-macos-min-version=11.0 \
            --output-dir=dist \
            --output-filename=RepTate.bin \
            --noinclude-qt-translations \
            --python-flag=-m \
            --include-package=RepTate.tools \
            --include-module=RepTate.gui.Reptate_rc \
            --include-module=RepTate.gui.About_rc \
            --include-module=RepTate.gui.Theory_rc \
            --include-module=RepTate.gui.Tool_rc \
            --include-module=RepTate.gui.MainWindow_rc \
            --include-data-dir=data=data \
            --include-data-dir=RepTate/gui/Images=RepTate/gui/Images \
            --include-data-files=RepTate/tools/*.npy=RepTate/tools/ \
            --include-data-files=RepTate/theories/*.npz=RepTate/theories/ \
            --include-data-files=RepTate/theories/*_darwin*.so=RepTate/theories/ \
            RepTate

      - name: Add docs into app/dist folder (macOS)
        shell: bash
        run: |
          APP_PATH="dist/RepTate.app"
          RESOURCES_DIR="$APP_PATH/Contents/Resources"
          test -d "$APP_PATH"
          mkdir -p "$RESOURCES_DIR/docs/build/html"
          cp -a docs_html/. "$RESOURCES_DIR/docs/build/html/"

      - name: Audit macOS bundle compatibility
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="dist/RepTate.app"
          EXECUTABLE="$APP_PATH/Contents/MacOS/RepTate.bin"
          test -f "$EXECUTABLE"

          echo "== macOS build identity =="
          uname -m
          python -c "import platform; print(platform.machine())"
          test "$(uname -m)" = "x86_64"
          python -c "import platform; assert platform.machine() == 'x86_64'"
          echo "architecture: x86_64 (expected)"
          file "$EXECUTABLE"
          file "$EXECUTABLE" | grep -q 'x86_64'

          audit_binary() {
            local binary="$1"
            local file_info
            local architecture
            local deployment_target
            file_info="$(file "$binary")"
            architecture="unknown"
            case "$file_info" in
              *x86_64*) architecture="x86_64" ;;
              *arm64*) architecture="arm64" ;;
            esac
            echo "path: $binary"
            echo "architecture: $architecture"
            echo "$file_info"
            deployment_target="$(otool -l "$binary" | awk '/LC_BUILD_VERSION/{found=1; next} found && /minos/{print $2; exit} /LC_VERSION_MIN_MACOSX/{found=2; next} found == 2 && /version/{print $2; exit}')"
            echo "minimum macOS: ${deployment_target:-unknown}"
            if [[ "$deployment_target" =~ ^([0-9]+)\. ]]; then
              if (( BASH_REMATCH[1] > 11 )); then
                echo "::warning file=$binary::requires macOS $deployment_target, newer than intended minimum 11.0"
              fi
            fi
            otool -l "$binary" | grep -A4 -E 'LC_BUILD_VERSION|LC_VERSION_MIN_MACOSX' | grep -E 'cmd |platform |minos |version ' || true
          }

          echo "== main executable deployment target =="
          audit_binary "$EXECUTABLE"

          find_representative() {
            local label="$1"
            local pattern="$2"
            local binary
            binary="$(find "$APP_PATH/Contents" -type f \( -name '*.dylib' -o -name '*.so' \) -print | grep -Ei "$pattern" | sort | head -n 1 || true)"
            if [[ -n "$binary" ]]; then
              echo "== $label representative =="
              audit_binary "$binary"
            else
              echo "::warning::No representative $label native binary found (pattern: $pattern)"
            fi
          }

          echo "== representative native components =="
          find_representative "PySide6 / Qt" 'pyside6|/qt[^/]*|qt[^/]*\.(dylib|so)$'
          find_representative "Shiboken" 'shiboken'
          find_representative "NumPy" 'numpy'
          find_representative "SciPy" 'scipy'
          find_representative "RepTate native" '_darwin[^/]*\.so$'

          require_directory() {
            local label="$1"
            local path="$2"
            if [[ -d "$path" ]]; then
              echo "present directory ($label): $path"
            else
              echo "::error::Missing required directory ($label): $path"
              return 1
            fi
          }

          echo "== bundle layout (relevant paths) =="
          find "$APP_PATH/Contents" -maxdepth 7 \( -type d -o -type l \) -print | grep -E '/(data|RepTate|theories|tools|Images|docs|html)(/|$)' | sort || true

          echo "== bundle resources =="
          DATA_DIR=""
          for candidate in \
            "$APP_PATH/Contents/Resources/data" \
            "$APP_PATH/Contents/MacOS/data"; do
            if [[ -d "$candidate" ]]; then
              echo "present runtime data directory: $candidate"
              DATA_DIR="$candidate"
              break
            fi
            echo "missing runtime data candidate: $candidate"
          done
          if [[ -z "$DATA_DIR" ]]; then
            echo "::error::Missing runtime data directory; checked Contents/Resources/data and Contents/MacOS/data"
            exit 1
          fi

          require_directory "offline HTML documentation" "$APP_PATH/Contents/Resources/docs/build/html"

          PACKAGE_DIR=""
          for candidate in \
            "$APP_PATH/Contents/MacOS/RepTate" \
            "$APP_PATH/Contents/Resources/RepTate"; do
            if [[ -d "$candidate" ]]; then
              echo "present RepTate package directory: $candidate"
              PACKAGE_DIR="$candidate"
              break
            fi
            echo "missing RepTate package candidate: $candidate"
          done
          if [[ -z "$PACKAGE_DIR" ]]; then
            echo "::error::Missing RepTate package directory; checked Contents/MacOS/RepTate and Contents/Resources/RepTate"
            exit 1
          fi

          require_directory "RepTate theories" "$PACKAGE_DIR/theories"
          require_directory "RepTate tools" "$PACKAGE_DIR/tools"
          require_directory "RepTate GUI images" "$PACKAGE_DIR/gui/Images"
          echo "Runtime data, RepTate package resources, and offline HTML docs are present"

      - name: Zip artifact (macOS)
        shell: bash
        run: |
          ZIP="RepTate-${{ github.ref_name }}-macos.zip"
          OUTDIR="dist/RepTate.app"
          test -d "$OUTDIR"
          rm -f "dist/$ZIP"
          (cd "$(dirname "$OUTDIR")" && zip -r "$GITHUB_WORKSPACE/dist/$ZIP" "$(basename "$OUTDIR")")
          unzip -l "dist/$ZIP" | grep -q 'RepTate.app/Contents/MacOS/'
          unzip -l "dist/$ZIP" | grep -q 'RepTate.app/Contents/Resources/docs/build/html/'
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: RepTate-${{ github.ref_name }}-macos
          path: dist/${{ env.ZIP }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-docs, build-windows, build-linux, build-macos]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            **/*.zip
